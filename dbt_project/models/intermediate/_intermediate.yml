version: 2

models:
  - name: int_student_attendance
    description: Student-year attendance metrics with chronic absence flag
    columns:
      - name: student_key
        tests:
          - not_null
      - name: school_year
        tests:
          - not_null

  - name: int_student_behavior
    description: Student-year behavior metrics with risk flag
    columns:
      - name: student_key
        tests:
          - not_null
      - name: school_year
        tests:
          - not_null

  - name: int_student_course_performance
    description: Student-year course performance metrics
    columns:
      - name: student_key
        tests:
          - not_null
      - name: school_year
        tests:
          - not_null

  - name: int_student_assignments
    description: Student-year assignment metrics
    columns:
      - name: student_key
        tests:
          - not_null
      - name: school_year
        tests:
          - not_null
