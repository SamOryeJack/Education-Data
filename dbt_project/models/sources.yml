version: 2
sources:
  - name: main
    schema: main
    tables:
      # Original tables
      - name: dim_students
        description: Student dimension with Marvel character names
      - name: dim_terms
        description: Academic terms (Fall 2022 - Spring 2026)
      - name: dim_courses
        description: Course catalog with sections
      - name: fct_grades
        description: Course grades by quarter
      - name: fct_attendance_quarter
        description: Quarterly attendance summaries
      - name: fct_attendance_daily
        description: Daily attendance by period
      - name: fct_attendance_course
        description: Course-level attendance totals
      - name: fct_assignments
        description: Individual assignment scores
      - name: fct_student_term_enrollment
        description: Student enrollment by term
      - name: ref_attendance_codes
        description: Attendance code definitions
      
      # V3 tables (ESSA alignment)
      - name: fct_graduation_outcomes
        description: "V3: Student graduation cohort tracking and final status for ACGR"
      - name: fct_esl_progression
        description: "V3: ESL level progression by student-year (ESSA Indicator 4)"
      - name: fct_course_credits
        description: "V3: Credits attempted and earned per course"
      - name: fct_standardized_tests
        description: "V3: Synthetic PSAT/SAT scores for juniors"
      - name: fct_ap_exam_scores
        description: "V3: AP exam scores derived from course grades"
      - name: fct_interventions
        description: "V3: Intervention records for at-risk students"
