version: 2

models:
  - name: stg_students
    description: Cleaned student dimension with full_name
    columns:
      - name: student_key
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_grades
    description: Grades with passing/failing flags
    columns:
      - name: grade_key
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_attendance_quarter
    description: Quarterly attendance with absence_rate
    columns:
      - name: att_quarter_key
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_attendance_daily
    description: Daily attendance with behavior flags
    columns:
      - name: att_daily_key
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_assignments
    description: Assignments with score_pct
    columns:
      - name: assignment_key
        description: Primary key
        tests:
          - unique
          - not_null
