version: 2

models:
  - name: mart_student_accountability
    description: Complete ABC framework profile for each student-year
    columns:
      - name: student_key
        tests:
          - not_null
      - name: school_year
        tests:
          - not_null
      - name: abc_risk_score
        description: Sum of A+B+C flags (0-3)
        tests:
          - accepted_values:
              values: [0, 1, 2, 3]

  - name: mart_school_year_summary
    description: Aggregated metrics by year and subgroup (ESSA-style)
    columns:
      - name: school_year
        tests:
          - not_null
      - name: subgroup_type
        tests:
          - accepted_values:
              values: ['Overall', 'Gender', 'Program', 'Boarding']
