version: 2

models:
  - name: mart_student_accountability
    description: Complete ABC framework profile for each student-year
    columns:
      - name: student_key
        tests:
          - not_null
      - name: school_year
        tests:
          - not_null
      - name: abc_risk_score
        description: Sum of A+B+C flags (0-3)
        tests:
          - accepted_values:
              values: [0, 1, 2, 3]

  - name: mart_school_year_summary
    description: Aggregated metrics by year and subgroup (ESSA-style)
    columns:
      - name: school_year
        tests:
          - not_null
      - name: subgroup_type
        tests:
          - accepted_values:
              values: ['Overall', 'Gender', 'Program', 'Boarding']

  - name: mart_acgr
    description: "V3: Adjusted Cohort Graduation Rate by subgroup with N-size suppression"
    columns:
      - name: cohort_year
        tests:
          - not_null
      - name: subgroup_type
        tests:
          - not_null
          - accepted_values:
              values: ['Overall', 'Gender', 'Country', 'ESL Level']
      - name: acgr
        description: "Graduation rate (graduates / adjusted_cohort * 100)"
      - name: is_suppressed
        description: "1 if N < 10 (FERPA compliance)"
        tests:
          - accepted_values:
              values: [0, 1]

  - name: mart_essa_accountability
    description: "V3: All 5 ESSA indicators by subgroup with N-size suppression"
    columns:
      - name: school_year
        tests:
          - not_null
      - name: subgroup_type
        tests:
          - not_null
          - accepted_values:
              values: ['Overall', 'Gender', 'ESL Level']
      - name: is_suppressed
        description: "1 if N < 10 (FERPA compliance)"
        tests:
          - accepted_values:
              values: [0, 1]
